<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Behave like an app on phones: no pinch or double-tap zoom, and draw under the notch / home bar (see safe-area padding). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <!-- Home screen: open full-screen with the Spark icon and name, on Android (manifest) and iPhone (apple-* tags). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Spark CRM" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Matches the top bar; ThemeProvider switches it for dark mode. -->
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Apply the saved theme before first paint; light unless the user chose dark. Keep in sync with src/lib/ThemeProvider.tsx.
      try {
        var dark = localStorage.getItem('spark-crm.theme') === 'dark'
        document.documentElement.classList.toggle('dark', dark)
        document.querySelector('meta[name=theme-color]').setAttribute('content', dark ? '#1c1c1d' : '#ffffff')
      } catch (e) {}
      // iPhone Safari ignores user-scalable=no, so block its pinch gesture directly.
      document.addEventListener('gesturestart', function (e) { e.preventDefault() }, { passive: false })
    </script>
    <title>Spark CRM</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
